name: Publish

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      # Tiny gem, no Gemfile. release-gem@v1 runs bundle exec rake release
      # and dies. Trusted publisher still matches this filename.
      - uses: rubygems/configure-rubygems-credentials@v2.1.0
      - run: |
          gem build parseapi.gemspec
          gem push parseapi-*.gem
